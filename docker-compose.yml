version: '3.8'

services:
  agent:
    build: .
    container_name: ai-api-testing-agent
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./artifacts:/app/artifacts
      - ./examples:/app/examples
    restart: unless-stopped

  mock-api:
    image: python:3.11-slim
    container_name: mock-target-api
    working_dir: /app
    volumes:
      - ./examples:/app
    command: python /app/mock_server.py
    ports:
      - "8000:8000"
    restart: unless-stopped
